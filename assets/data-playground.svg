<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Animated data playground: fitting a pattern, learning from errors, comparing models" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Courier New', Consolas, monospace; }
    .title { fill:#64748B; font-size:12px; }
    .ptitle { fill:#94A3B8; font-size:12px; font-weight:bold; }
    .lbl { fill:#94A3B8; font-size:10px; }
    .leg { fill:#94A3B8; font-size:10px; }
    .grid { stroke:#1E293B; stroke-width:1; }
    .axis { stroke:#334155; stroke-width:1.5; }
    .pt { fill:#38BDF8; opacity:0; transform-box:fill-box; transform-origin:center; animation:pt 8s ease-out infinite; }
    .fit { fill:none; stroke:url(#ln); stroke-width:3; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 8s ease-in-out infinite; animation-delay:1.8s; }
    .train { fill:none; stroke:#2563EB; stroke-width:3; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 8s ease-in-out infinite; animation-delay:0.4s; }
    .val { fill:none; stroke:#06B6D4; stroke-width:3; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 8s ease-in-out infinite; animation-delay:0.9s; }
    .bar { transform-box:fill-box; transform-origin:50% 100%; transform:scaleY(0); animation:bar 8s ease-out infinite; animation-delay:0.6s; }
    @keyframes pt { 0% {opacity:0; transform:scale(0);} 6% {opacity:1; transform:scale(1.5);} 10% {opacity:1; transform:scale(1);} 90% {opacity:1;} 100% {opacity:0;} }
    @keyframes draw { 0% {stroke-dashoffset:1; opacity:1;} 40% {stroke-dashoffset:0;} 90% {stroke-dashoffset:0; opacity:1;} 100% {stroke-dashoffset:0; opacity:0;} }
    @keyframes bar { 0% {transform:scaleY(0); opacity:1;} 22% {transform:scaleY(1);} 90% {transform:scaleY(1); opacity:1;} 100% {transform:scaleY(1); opacity:0;} }
  </style>

  <rect x="1" y="1" width="898" height="298" rx="14" fill="#0F172A" stroke="#1E293B"/>
  <circle cx="22" cy="24" r="5" fill="#F87171"/>
  <circle cx="40" cy="24" r="5" fill="#FBBF24"/>
  <circle cx="58" cy="24" r="5" fill="#34D399"/>
  <text x="80" y="28" class="title">data-lab ~ fit, learn, compare</text>

  <rect x="20" y="48" width="260" height="235" rx="10" fill="#111C33" stroke="#1E3A5F"/>
  <rect x="320" y="48" width="260" height="235" rx="10" fill="#111C33" stroke="#1E3A5F"/>
  <rect x="620" y="48" width="260" height="235" rx="10" fill="#111C33" stroke="#1E3A5F"/>
  <line x1="30" y1="120" x2="270" y2="120" class="grid"/><line x1="30" y1="170" x2="270" y2="170" class="grid"/><line x1="30" y1="220" x2="270" y2="220" class="grid"/><line x1="330" y1="120" x2="570" y2="120" class="grid"/><line x1="330" y1="170" x2="570" y2="170" class="grid"/><line x1="330" y1="220" x2="570" y2="220" class="grid"/><line x1="630" y1="120" x2="870" y2="120" class="grid"/><line x1="630" y1="170" x2="870" y2="170" class="grid"/><line x1="630" y1="220" x2="870" y2="220" class="grid"/>

  <text x="36" y="72" class="ptitle">find the pattern</text>
  <text x="336" y="72" class="ptitle">learn from errors</text>
  <text x="636" y="72" class="ptitle">compare models</text>

  <line x1="30" y1="85" x2="30" y2="255" class="axis"/><line x1="30" y1="255" x2="270" y2="255" class="axis"/>
  <line x1="330" y1="85" x2="330" y2="255" class="axis"/><line x1="330" y1="255" x2="570" y2="255" class="axis"/>
  <line x1="630" y1="85" x2="630" y2="255" class="axis"/><line x1="630" y1="255" x2="870" y2="255" class="axis"/>

  <g>
    <circle class="pt" cx="48" cy="232" r="4.5" style="animation-delay:0.00s"/>
    <circle class="pt" cx="62" cy="222" r="4.5" style="animation-delay:0.12s"/>
    <circle class="pt" cx="76" cy="226" r="4.5" style="animation-delay:0.24s"/>
    <circle class="pt" cx="92" cy="205" r="4.5" style="animation-delay:0.36s"/>
    <circle class="pt" cx="108" cy="196" r="4.5" style="animation-delay:0.48s"/>
    <circle class="pt" cx="122" cy="200" r="4.5" style="animation-delay:0.60s"/>
    <circle class="pt" cx="138" cy="175" r="4.5" style="animation-delay:0.72s"/>
    <circle class="pt" cx="152" cy="168" r="4.5" style="animation-delay:0.84s"/>
    <circle class="pt" cx="168" cy="172" r="4.5" style="animation-delay:0.96s"/>
    <circle class="pt" cx="184" cy="148" r="4.5" style="animation-delay:1.08s"/>
    <circle class="pt" cx="198" cy="140" r="4.5" style="animation-delay:1.20s"/>
    <circle class="pt" cx="214" cy="124" r="4.5" style="animation-delay:1.32s"/>
    <circle class="pt" cx="230" cy="128" r="4.5" style="animation-delay:1.44s"/>
    <circle class="pt" cx="250" cy="104" r="4.5" style="animation-delay:1.56s"/>
    <path class="fit" pathLength="1" d="M38 238 L262 98"/>
  </g>

  <g>
    <path class="train" pathLength="1" d="M335 100 C 375 125, 395 190, 435 212 S 510 238, 565 242"/>
    <path class="val" pathLength="1" d="M335 98 C 375 130, 400 188, 445 208 S 520 222, 565 226"/>
    <circle cx="470" cy="104" r="4" fill="#2563EB"/><text x="480" y="108" class="leg">train</text>
    <circle cx="525" cy="104" r="4" fill="#06B6D4"/><text x="535" y="108" class="leg">val</text>
  </g>

  <g>
    <rect class="bar" x="640" y="200" width="34" height="55" rx="4" fill="url(#bg)" style="animation-delay:0.0s"/>
    <text x="657" y="272" text-anchor="middle" class="lbl">Linear</text>
    <rect class="bar" x="686" y="165" width="34" height="90" rx="4" fill="url(#bg)" style="animation-delay:0.3s"/>
    <text x="703" y="272" text-anchor="middle" class="lbl">RF</text>
    <rect class="bar" x="732" y="140" width="34" height="115" rx="4" fill="url(#bg)" style="animation-delay:0.6s"/>
    <text x="749" y="272" text-anchor="middle" class="lbl">XGB</text>
    <rect class="bar" x="778" y="130" width="34" height="125" rx="4" fill="url(#bg)" style="animation-delay:0.9s"/>
    <text x="795" y="272" text-anchor="middle" class="lbl">LGBM</text>
    <rect class="bar" x="824" y="115" width="34" height="140" rx="4" fill="url(#bg)" style="animation-delay:1.2s"/>
    <text x="841" y="272" text-anchor="middle" class="lbl">Cat</text>
  </g>
</svg>
